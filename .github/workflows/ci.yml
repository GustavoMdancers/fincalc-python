name: FinCalc CI - Professional Static Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    name: Build Verification & Linter (Flake8 & Bandit)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Ferramentas de Análise Estática
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validar Sintaxe (Compilação Nativa)
      run: python -m py_compile fincalc.py

    - name: Executar Linter de Estilo e Boas Práticas (Flake8)
      run: flake8 fincalc.py

    - name: Executar Linter de Segurança (Bandit)
      run: bandit -r fincalc.py
